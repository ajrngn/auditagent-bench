name: Deploy site

# Publishes site/ to GitHub Pages. Runs on any push to main that touches the
# site, so editing a page in the GitHub web editor is enough to make it live.
#
# No secrets. Pages deployment authenticates with the built-in GITHUB_TOKEN
# via the permissions block below.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once. Queue rather than cancel — cancelling a
# half-finished deploy can leave the site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # site/CNAME carries the custom domain and must be in the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
